name: HiveBridge smoke tests
on:
  pull_request:
    paths:
      - 'hivebridge/**'
      - '.github/workflows/hivebridge-checks.yml'
  push:
    branches: [main]
    paths:
      - 'hivebridge/**'
      - '.github/workflows/hivebridge-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract source bundle and run tests
        run: |
          mkdir -p /tmp/hivebridge
          tar -xJf hivebridge/HiveBridge-v0.1-source.tar.xz -C /tmp/hivebridge
          cd /tmp/hivebridge
          python -m unittest discover -s tests -v
          python -m hivebridge demo --mode council --text "CI readiness check" > /tmp/hivebridge-demo.json
          grep -q 'SIMULATED' /tmp/hivebridge-demo.json
