name: HiveBridge Pages
on:
  push:
    branches: [main]
    paths:
      - 'hivebridge/site/**'
      - '.github/workflows/hivebridge-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hivebridge-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site
        run: test -s hivebridge/site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hivebridge/site
      - id: deployment
        uses: actions/deploy-pages@v4
