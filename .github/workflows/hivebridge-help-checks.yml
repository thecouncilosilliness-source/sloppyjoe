name: Humanity Help first-aid site checks
on:
  pull_request:
    paths:
      - 'hivebridge/site/**'
      - '.github/workflows/hivebridge-help-checks.yml'
  push:
    branches: [main]
    paths:
      - 'hivebridge/site/**'
      - '.github/workflows/hivebridge-help-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no-data static guide and recovery content
        run: python -m unittest discover -s hivebridge/site/tests -p 'test_*.py' -v
